<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvera Business Systems — Portal</title>
  <style>html,body{margin:0;min-height:100%;background:#f7f4ee}body{font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#1e2e1e;font-size:20px}</style>
</head>
<body>
  <div class="loading">Loading portal…</div>
  <script>
    const largerPortalType = `
      <style id="larger-portal-type">
        .eye{font-size:14px!important}.brand small,.sideBrand small{font-size:12px!important}.hero p{font-size:20px!important;line-height:1.75!important}.preview span{font-size:14px!important}.intro{font-size:17px!important;line-height:1.55!important}.loginCard label{font-size:16px!important}.loginCard input,.loginCard select{font-size:17px!important;padding:16px!important}.pass button{font-size:14px!important}.enter,.action{font-size:16px!important;padding:14px 19px!important}.error,.back{font-size:14px!important}.note{font-size:14px!important}.nav button{font-size:16px!important;padding:14px!important}.user strong{font-size:15px!important}.user small{font-size:12px!important}.logout{font-size:14px!important}.top h2{font-size:35px!important}.head h3,.welcome h3,.clientHero h3{font-size:44px!important}.head p,.welcome p,.clientHero p{font-size:16px!important;line-height:1.55!important}.chip,.status{font-size:13px!important;padding:7px 12px!important}.alert strong{font-size:16px!important}.alert p{font-size:14px!important}.card>span{font-size:14px!important}.card>strong{font-size:38px!important}.card small{font-size:13px!important}.panel h3{font-size:32px!important}.list strong,.pay strong{font-size:15px!important}.list small,.pay small{font-size:13px!important}.money{font-size:22px!important}.project h4,.client h4{font-size:30px!important}.project p,.client p{font-size:14px!important;line-height:1.7!important}.stages span{font-size:11px!important}.meta small{font-size:12px!important}.meta strong{font-size:15px!important}.tableWrap th{font-size:12px!important}.tableWrap td{font-size:14px!important;padding:16px!important}.tableWrap td small{font-size:12px!important}.stageMarks span{font-size:14px!important}.stageMarks small{font-size:12px!important}.update{font-size:15px!important;line-height:1.8!important}.timeline h4{font-size:30px!important}.timeline p{font-size:13px!important}.timeline>div>strong{font-size:26px!important}.file strong{font-size:14px!important}.file small{font-size:12px!important}.file button{font-size:13px!important}.support label{font-size:15px!important}.support textarea,.support select{font-size:16px!important}.tickets strong{font-size:15px!important}.tickets p{font-size:14px!important}.tickets small{font-size:12px!important}.empty-state{background:rgba(255,255,255,.72);border:1px dashed rgba(30,46,30,.18);border-radius:16px;padding:38px;text-align:center;color:#756f63}.empty-state strong{display:block;color:#1a1a18;font:600 28px 'Cormorant Garamond';margin-bottom:8px}@media(max-width:1000px){.content{padding-left:24px!important;padding-right:24px!important}}@media(max-width:720px){.top h2{font-size:28px!important}.head h3,.welcome h3,.clientHero h3{font-size:38px!important}.panel h3{font-size:29px!important}.nav button{font-size:17px!important}.tableWrap td{font-size:13px!important}.stageMarks span{font-size:13px!important}}
      </style>`;

    Promise.all([
      fetch('portal.html?v=5', {cache:'no-store'}).then(r => { if(!r.ok) throw new Error('portal'); return r.text(); }),
      fetch('portal-clean.js?v=5', {cache:'no-store'}).then(r => { if(!r.ok) throw new Error('clean'); return r.text(); }),
      fetch('portal-enhance.js?v=5', {cache:'no-store'}).then(r => { if(!r.ok) throw new Error('enhance'); return r.text(); }),
      fetch('portal-payment-connect.js?v=5', {cache:'no-store'}).then(r => { if(!r.ok) throw new Error('payment'); return r.text(); })
    ]).then(([html, cleanScript, enhanceScript, paymentScript]) => {
      html = html.replace('</head>', largerPortalType + '</head>');
      const scripts = '<script>' + cleanScript.replace(/<\/script>/gi,'<\\/script>') + '<\/script><script>' + enhanceScript.replace(/<\/script>/gi,'<\\/script>') + '<\/script><script>' + paymentScript.replace(/<\/script>/gi,'<\\/script>') + '<\/script>';
      html = html.replace('</body>', scripts + '</body>');
      document.open();
      document.write(html);
      document.close();
    }).catch(() => {
      document.body.innerHTML = '<div class="loading">The portal could not be loaded. Please refresh the page.</div>';
    });
  </script>
</body>
</html>
